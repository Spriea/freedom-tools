<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="新App福利，发现更多实用应用。">
  <title>新App福利 · 一休工具</title>
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    .benefits-card {
      width: min(100%, 460px);
      margin: 0;
      padding: 40px 24px;
      text-align: center;
    }
    .benefits-icon {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 22px;
      color: var(--blue);
      background: #eef4ff;
    }
    .benefits-icon svg { width: 34px; height: 34px; }
    .benefits-card h1 { margin: 0; font-size: clamp(22px, 5.5vw, 28px); line-height: 1.4; }
    .benefits-card p { margin: 12px 0 28px; font-size: 15px; }
    .benefits-card .button { min-height: 48px; min-width: 160px; border-radius: 14px; }
  </style>
</head>
<body>
  <main class="card benefits-card" aria-labelledby="benefits-title">
    <div class="benefits-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1"></rect>
        <path d="M5 12v8h14v-8M12 8v12M12 8H8a3 3 0 1 1 3-3l1 3Zm0 0h4a3 3 0 1 0-3-3l-1 3Z"></path>
      </svg>
    </div>
    <h1 id="benefits-title">暂无新App福利</h1>
    <p>发现更多实用应用，欢迎访问官方网站。</p>
    <a class="button" href="../index.html">官方网站</a>
  </main>
</body>
</html>
